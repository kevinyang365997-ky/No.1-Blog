<!DOCTYPE html>
<html lang="<!-- SITE_LANGUAGE -->">

<head>
    <!-- INCLUDE:head-base -->

    <title><!-- VIDEOS_PAGE_TITLE --> - <!-- SITE_TITLE --></title>

    <!-- VIDEOS_SEO_HEAD -->

    <style>
        .videos-filter[aria-pressed="true"] {
            border-color: transparent;
            background: #22c55e;
            color: #ffffff;
        }

        .video-card[hidden] {
            display: none;
        }

        .video-card {
            display: inline-block;
            width: 100%;
            margin-bottom: 1.5rem;
            break-inside: avoid;
            transition:
                transform 180ms ease,
                box-shadow 180ms ease,
                border-color 180ms ease;
        }

        .video-card:hover {
            transform: translateY(-4px);
            border-color: #cbd5e1;
            box-shadow: 0 18px 45px rgb(15 23 42 / 8%);
        }

        .dark .video-card:hover {
            border-color: #475569;
            box-shadow: 0 18px 45px rgb(0 0 0 / 25%);
        }

        #videos-grid {
            column-count: 1;
            column-gap: 1.5rem;
        }

        @media (min-width: 768px) {
            #videos-grid {
                column-count: 2;
            }
        }

        @media (min-width: 1280px) {
            #videos-grid {
                column-count: 3;
            }
        }
    </style>
</head>

<body
    data-content-locale="<!-- VIDEOS_CONTENT_LOCALE -->"
    data-content-kind="video-list"
    class="bg-background-light font-display text-[#1e293b] transition-colors duration-200 dark:bg-background-dark dark:text-slate-200"
>
    <div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">

        <!-- INCLUDE:header -->

        <main
            class="page-blur-target mt-[var(--freecat-page-top-offset)] grow px-5 pb-20 pt-10 sm:px-8 md:px-16 lg:px-28"
        >
            <div class="mx-auto w-full max-w-[1300px]">

                <div
                    data-video-language-fallback
                    class="mb-8 hidden rounded-2xl border border-amber-200 bg-amber-50 px-5 py-4 text-sm leading-6 text-amber-900 dark:border-amber-900 dark:bg-amber-950/40 dark:text-amber-200"
                >
                    <!-- VIDEOS_FALLBACK_NOTICE -->
                </div>

                <!-- 页面标题 -->
                <section class="mb-10 text-center md:mb-14">
                    <p
                        class="mb-3 text-sm font-medium uppercase tracking-[0.22em] text-primary"
                    >
                        Video Library
                    </p>

                    <h1
                        class="mb-5 text-4xl font-bold tracking-tight text-slate-900 dark:text-white md:text-5xl"
                    >
                        <!-- VIDEOS_PAGE_TITLE -->
                    </h1>

                    <p
                        class="mx-auto max-w-3xl text-base leading-8 text-slate-500 dark:text-slate-400"
                    >
                        <!-- VIDEOS_PAGE_DESCRIPTION -->
                    </p>
                </section>

                <!-- 平台筛选 -->
                <nav
                    class="mb-10 flex flex-wrap justify-center gap-3"
                    aria-label="<!-- VIDEOS_FILTER_LABEL -->"
                >
                    <button
                        type="button"
                        class="videos-filter rounded-full border border-slate-200 bg-white px-5 py-2.5 text-sm text-slate-600 transition hover:border-primary hover:text-primary dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300"
                        data-video-filter="all"
                        aria-pressed="true"
                    >
                        <!-- VIDEOS_ALL_LABEL -->
                    </button>

                    <button
                        type="button"
                        class="videos-filter rounded-full border border-slate-200 bg-white px-5 py-2.5 text-sm text-slate-600 transition hover:border-primary hover:text-primary dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300"
                        data-video-filter="youtube"
                        aria-pressed="false"
                    >
                        YouTube
                    </button>

                    <button
                        type="button"
                        class="videos-filter rounded-full border border-slate-200 bg-white px-5 py-2.5 text-sm text-slate-600 transition hover:border-primary hover:text-primary dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300"
                        data-video-filter="tiktok"
                        aria-pressed="false"
                    >
                        TikTok
                    </button>

                    <button
                        type="button"
                        class="videos-filter rounded-full border border-slate-200 bg-white px-5 py-2.5 text-sm text-slate-600 transition hover:border-primary hover:text-primary dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300"
                        data-video-filter="facebook"
                        aria-pressed="false"
                    >
                        Facebook
                    </button>

                    <button
                        type="button"
                        class="videos-filter rounded-full border border-slate-200 bg-white px-5 py-2.5 text-sm text-slate-600 transition hover:border-primary hover:text-primary dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300"
                        data-video-filter="douyin"
                        aria-pressed="false"
                    >
                        <!-- VIDEOS_DOUYIN_LABEL -->
                    </button>

                    <button
                        type="button"
                        class="videos-filter rounded-full border border-slate-200 bg-white px-5 py-2.5 text-sm text-slate-600 transition hover:border-primary hover:text-primary dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300"
                        data-video-filter="kuaishou"
                        aria-pressed="false"
                    >
                        <!-- VIDEOS_KUAISHOU_LABEL -->
                    </button>

                    <button
                        type="button"
                        class="videos-filter rounded-full border border-slate-200 bg-white px-5 py-2.5 text-sm text-slate-600 transition hover:border-primary hover:text-primary dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300"
                        data-video-filter="wechat-video"
                        aria-pressed="false"
                    >
                        <!-- VIDEOS_WECHAT_LABEL -->
                    </button>

                    <button
                        type="button"
                        class="videos-filter rounded-full border border-slate-200 bg-white px-5 py-2.5 text-sm text-slate-600 transition hover:border-primary hover:text-primary dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300"
                        data-video-filter="xiaohongshu"
                        aria-pressed="false"
                    >
                        <!-- VIDEOS_XIAOHONGSHU_LABEL -->
                    </button>

                    <button
                        type="button"
                        class="videos-filter rounded-full border border-slate-200 bg-white px-5 py-2.5 text-sm text-slate-600 transition hover:border-primary hover:text-primary dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300"
                        data-video-filter="local"
                        aria-pressed="false"
                    >
                        <!-- VIDEOS_LOCAL_LABEL -->
                    </button>
                </nav>

                <!-- 视频瀑布流 -->
                <section
                    id="videos-grid"
                    aria-label="<!-- VIDEOS_LIST_LABEL -->"
                >
                    <!-- VIDEOS_ITEMS -->
                </section>

                <!-- 暂无内容 -->
                <section
                    id="videos-empty"
                    class="hidden rounded-3xl border border-dashed border-slate-300 px-6 py-20 text-center dark:border-slate-700"
                >
                    <h2
                        class="mb-3 text-2xl font-semibold text-slate-800 dark:text-white"
                    >
                        <!-- VIDEOS_EMPTY_TITLE -->
                    </h2>

                    <p class="text-sm text-slate-500 dark:text-slate-400">
                        <!-- VIDEOS_EMPTY_DESCRIPTION -->
                    </p>
                </section>

            </div>
        </main>

        <!-- INCLUDE:footer-no-social -->
    </div>

    <!-- INCLUDE:scripts-end -->

    <script>
        (() => {
            const filterButtons =
                Array.from(document.querySelectorAll(".videos-filter"));

            const videoCards =
                Array.from(document.querySelectorAll(".video-card"));

            const emptyState =
                document.getElementById("videos-empty");

            function filterVideos(platform) {
                let visibleCount = 0;

                videoCards.forEach((card) => {
                    const cardPlatform =
                        card.dataset.videoPlatform || "";

                    const shouldShow =
                        platform === "all" ||
                        cardPlatform === platform;

                    card.hidden = !shouldShow;

                    if (shouldShow) {
                        visibleCount += 1;
                    }
                });

                emptyState.classList.toggle(
                    "hidden",
                    visibleCount !== 0
                );
            }

            filterButtons.forEach((button) => {
                button.addEventListener("click", () => {
                    const platform =
                        button.dataset.videoFilter || "all";

                    filterButtons.forEach((item) => {
                        item.setAttribute(
                            "aria-pressed",
                            String(item === button)
                        );
                    });

                    filterVideos(platform);
                });
            });

            filterVideos("all");
        })();
    </script>
</body>

</html>
