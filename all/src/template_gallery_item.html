<!DOCTYPE html>
<html lang="<!-- SITE_LANGUAGE -->">

<head>
    <!-- INCLUDE:head-base -->

    <title><!-- GALLERY_TITLE --> - <!-- SITE_TITLE --></title>

    <!-- GALLERY_ITEM_SEO_HEAD -->

    <style>
        .gallery-detail-image {
            display: block;
            width: auto;
            max-width: 100%;
            max-height: min(78vh, 920px);
            margin-inline: auto;
            object-fit: contain;
        }

        .gallery-detail-content img {
            display: block;
            max-width: 100%;
            height: auto;
            margin-inline: auto;
            border-radius: 1rem;
        }

        .gallery-detail-content h1,
        .gallery-detail-content h2,
        .gallery-detail-content h3 {
            scroll-margin-top: 120px;
        }

        .gallery-detail-content a {
            color: #16a34a;
            text-decoration: underline;
            text-underline-offset: 4px;
        }
    </style>
</head>

<body
    class="bg-background-light font-display text-[#1e293b] transition-colors duration-200 dark:bg-background-dark dark:text-slate-200"
>
    <div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">

        <!-- INCLUDE:header -->

        <main
            class="page-blur-target mt-[var(--freecat-page-top-offset)] grow px-5 pb-20 pt-8 sm:px-8 md:px-16 lg:px-28"
        >
            <div class="mx-auto w-full max-w-[1200px]">

                <!-- 返回图库 -->
                <a
                    href="/gallery"
                    class="mb-7 inline-flex items-center gap-2 text-sm text-slate-500 transition hover:text-primary dark:text-slate-400"
                >
                    <span aria-hidden="true">←</span>
                    返回图库
                </a>

                <!-- 图片展示 -->
                <article
                    class="overflow-hidden rounded-3xl border border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900"
                >
                    <div
                        class="flex min-h-[320px] items-center justify-center bg-slate-50 p-4 dark:bg-slate-950 md:p-8"
                    >
                        <!-- GALLERY_IMAGE -->
                    </div>

                    <div class="p-7 md:p-10">
                        <div class="mb-5 flex flex-wrap items-center gap-2">
                            <!-- GALLERY_CATEGORY_BADGE -->
                            <!-- GALLERY_FEATURED_BADGE -->
                        </div>

                        <h1
                            class="mb-5 text-4xl font-bold leading-tight tracking-tight text-slate-900 dark:text-white md:text-5xl"
                        >
                            <!-- GALLERY_TITLE -->
                        </h1>

                        <p
                            class="mb-8 max-w-4xl text-base leading-8 text-slate-500 dark:text-slate-400"
                        >
                            <!-- GALLERY_SUMMARY -->
                        </p>

                        <dl
                            class="grid gap-6 border-t border-slate-200 pt-7 text-sm dark:border-slate-800 sm:grid-cols-2 lg:grid-cols-4"
                        >
                            <div>
                                <dt class="mb-2 text-slate-400">记录时间</dt>
                                <dd class="text-slate-700 dark:text-slate-300">
                                    <!-- GALLERY_DATE -->
                                </dd>
                            </div>

                            <div>
                                <dt class="mb-2 text-slate-400">记录地点</dt>
                                <dd class="text-slate-700 dark:text-slate-300">
                                    <!-- GALLERY_LOCATION -->
                                </dd>
                            </div>

                            <div>
                                <dt class="mb-2 text-slate-400">摄影或制作</dt>
                                <dd class="text-slate-700 dark:text-slate-300">
                                    <!-- GALLERY_PHOTOGRAPHER -->
                                </dd>
                            </div>

                            <div>
                                <dt class="mb-2 text-slate-400">最后更新</dt>
                                <dd class="text-slate-700 dark:text-slate-300">
                                    <!-- GALLERY_UPDATED -->
                                </dd>
                            </div>
                        </dl>

                        <div class="mt-8">
                            <!-- GALLERY_ORIGINAL_LINK -->
                        </div>
                    </div>
                </article>

                <!-- 图片正文和目录 -->
                <div
                    class="mt-10 grid gap-8 lg:grid-cols-[minmax(0,1fr)_240px]"
                >
                    <article
                        class="gallery-detail-content min-w-0 rounded-3xl border border-slate-200 bg-white p-7 leading-8 dark:border-slate-800 dark:bg-slate-900 md:p-10"
                    >
                        <!-- GALLERY_CONTENT -->
                    </article>

                    <aside class="hidden lg:block">
                        <div
                            class="sticky top-[calc(var(--freecat-page-top-offset)+24px)] rounded-3xl border border-slate-200 bg-white p-6 dark:border-slate-800 dark:bg-slate-900"
                        >
                            <h2
                                class="mb-5 text-base font-semibold text-slate-900 dark:text-white"
                            >
                                图片目录
                            </h2>

                            <div
                                class="text-sm leading-7 text-slate-500 dark:text-slate-400"
                            >
                                <!-- GALLERY_TOC -->
                            </div>
                        </div>
                    </aside>
                </div>

                <!-- 关联内容 -->
                <section
                    class="mt-10 grid gap-6 md:grid-cols-2"
                >
                    <div
                        class="rounded-3xl border border-slate-200 bg-white p-7 dark:border-slate-800 dark:bg-slate-900"
                    >
                        <h2
                            class="mb-5 text-xl font-semibold text-slate-900 dark:text-white"
                        >
                            相关项目
                        </h2>

                        <div
                            class="text-sm leading-7 text-slate-500 dark:text-slate-400"
                        >
                            <!-- GALLERY_RELATED_PROJECTS -->
                        </div>
                    </div>

                    <div
                        class="rounded-3xl border border-slate-200 bg-white p-7 dark:border-slate-800 dark:bg-slate-900"
                    >
                        <h2
                            class="mb-5 text-xl font-semibold text-slate-900 dark:text-white"
                        >
                            相关文章
                        </h2>

                        <div
                            class="text-sm leading-7 text-slate-500 dark:text-slate-400"
                        >
                            <!-- GALLERY_RELATED_ARTICLES -->
                        </div>
                    </div>
                </section>

            </div>
        </main>

        <!-- INCLUDE:footer-no-social -->
    </div>

    <!-- INCLUDE:scripts-end -->
</body>

</html>
