<!DOCTYPE html>
<html lang="<!-- SITE_LANGUAGE -->">

<head>
    <!-- INCLUDE:head-base -->

    <title>项目 - <!-- SITE_TITLE --></title>

    <!-- PROJECTS_SEO_HEAD -->

    <style>
        .projects-filter[aria-pressed="true"] {
            border-color: transparent;
            background: #22c55e;
            color: #ffffff;
        }

        .project-card[hidden] {
            display: none;
        }

        .project-card {
            transition:
                transform 180ms ease,
                box-shadow 180ms ease,
                border-color 180ms ease;
        }

        .project-card:hover {
            transform: translateY(-4px);
            border-color: #cbd5e1;
            box-shadow: 0 18px 45px rgb(15 23 42 / 8%);
        }

        .dark .project-card:hover {
            border-color: #475569;
            box-shadow: 0 18px 45px rgb(0 0 0 / 25%);
        }
    </style>
</head>

<body
    class="bg-background-light font-display text-[#1e293b] transition-colors duration-200 dark:bg-background-dark dark:text-slate-200"
>
    <div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">

        <!-- INCLUDE:header -->

        <main
            class="page-blur-target mt-[var(--freecat-page-top-offset)] grow px-5 pb-20 pt-10 sm:px-8 md:px-16 lg:px-28"
        >
            <div class="mx-auto w-full max-w-[1300px]">

                <!-- 页面标题 -->
<section class="mb-10 text-center md:mb-14">
    <p
        class="mb-3 text-sm font-medium uppercase tracking-[0.22em] text-primary"
    >
        Projects &amp; Solutions
    </p>

    <h1
        id="projects-page-title"
        class="mb-5 text-4xl font-bold tracking-tight text-slate-900 dark:text-white md:text-5xl"
    >
        项目与解决方案
    </h1>

    <p
        id="projects-page-description"
        class="mx-auto max-w-3xl text-base leading-8 text-slate-500 dark:text-slate-400"
    >
        记录我主导和协作参与的项目，以及在实践中整理形成的解决方案。
    </p>
</section>

<!-- 分类筛选 -->
<nav
    class="mb-10 flex flex-wrap justify-center gap-3"
    aria-label="项目分类"
>
    <button
        id="projects-filter-all"
        type="button"
        class="projects-filter rounded-full border border-slate-200 bg-white px-5 py-2.5 text-sm text-slate-600 transition hover:border-primary hover:text-primary dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300"
        data-project-filter="all"
        aria-pressed="true"
    >
        全部项目
    </button>

    <button
        id="projects-filter-lead"
        type="button"
        class="projects-filter rounded-full border border-slate-200 bg-white px-5 py-2.5 text-sm text-slate-600 transition hover:border-primary hover:text-primary dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300"
        data-project-filter="lead"
        aria-pressed="false"
    >
        主导项目
    </button>

    <button
        id="projects-filter-collaboration"
        type="button"
        class="projects-filter rounded-full border border-slate-200 bg-white px-5 py-2.5 text-sm text-slate-600 transition hover:border-primary hover:text-primary dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300"
        data-project-filter="collaborative"
        aria-pressed="false"
    >
        协作项目
    </button>

    <button
        id="projects-filter-solutions"
        type="button"
        class="projects-filter rounded-full border border-slate-200 bg-white px-5 py-2.5 text-sm text-slate-600 transition hover:border-primary hover:text-primary dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300"
        data-project-filter="solution"
        aria-pressed="false"
    >
        解决方案
    </button>
</nav>

<!-- 项目卡片 -->
<section
    id="projects-grid"
    class="grid grid-cols-1 gap-6 md:grid-cols-2 xl:grid-cols-3"
    aria-label="项目列表"
>
    <!-- PROJECTS_ITEMS -->
</section>

<!-- 暂无内容 -->
<section
    id="projects-empty"
    class="hidden rounded-3xl border border-dashed border-slate-300 px-6 py-20 text-center dark:border-slate-700"
>
    <h2
        id="projects-empty-title"
        class="mb-3 text-2xl font-semibold text-slate-800 dark:text-white"
    >
        暂无项目
    </h2>

    <p
        id="projects-empty-description"
        class="text-sm text-slate-500 dark:text-slate-400"
    >
        当前分类的内容正在整理中。
    </p>
</section>
                
            </div>
        </main>

        <!-- INCLUDE:footer-no-social -->
    </div>

    <!-- INCLUDE:scripts-end -->

    <script>
        (() => {
            const filterButtons =
                Array.from(document.querySelectorAll(".projects-filter"));

            const projectCards =
                Array.from(document.querySelectorAll(".project-card"));

            const emptyState =
                document.getElementById("projects-empty");

            function filterProjects(category) {
                let visibleCount = 0;

                projectCards.forEach((card) => {
                    const cardCategory =
                        card.dataset.projectCategory || "";

                    const shouldShow =
                        category === "all" ||
                        cardCategory === category;

                    card.hidden = !shouldShow;

                    if (shouldShow) {
                        visibleCount += 1;
                    }
                });

                emptyState.classList.toggle(
                    "hidden",
                    visibleCount !== 0
                );
            }

            filterButtons.forEach((button) => {
                button.addEventListener("click", () => {
                    const category =
                        button.dataset.projectFilter || "all";

                    filterButtons.forEach((item) => {
                        item.setAttribute(
                            "aria-pressed",
                            String(item === button)
                        );
                    });

                    filterProjects(category);
                });
            });

            filterProjects("all");
        })();
    </script>
</body>

</html>
