<!DOCTYPE html>
<html lang="<!-- SITE_LANGUAGE -->">

<head>
    <!-- INCLUDE:head-base -->

    <title><!-- VIDEO_TITLE --> - <!-- SITE_TITLE --></title>

    <!-- VIDEO_SEO_HEAD -->

    <style>
        .video-player-shell {
            position: relative;
            overflow: hidden;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #0f172a;
        }

        .video-player-shell iframe,
        .video-player-shell video {
            width: 100%;
            height: 100%;
            border: 0;
        }

        .video-detail-content img {
            max-width: 100%;
            height: auto;
            margin-inline: auto;
            border-radius: 1rem;
        }

        .video-detail-content h1,
        .video-detail-content h2,
        .video-detail-content h3 {
            scroll-margin-top: 120px;
        }

        .video-detail-content a {
            color: #16a34a;
            text-decoration: underline;
            text-underline-offset: 4px;
        }
    </style>
</head>

<body
    data-content-locale="<!-- VIDEO_CONTENT_LOCALE -->"
    data-content-kind="video"
    data-content-id="<!-- VIDEO_ID -->"
    class="bg-background-light font-display text-[#1e293b] transition-colors duration-200 dark:bg-background-dark dark:text-slate-200"
>
    <div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">

        <!-- INCLUDE:header -->

        <main
            class="page-blur-target mt-[var(--freecat-page-top-offset)] grow px-5 pb-20 pt-8 sm:px-8 md:px-16 lg:px-28"
        >
            <div class="mx-auto w-full max-w-[1120px]">

                <!-- 返回视频库 -->
                <a
                    href="<!-- VIDEO_LIST_URL -->"
                    class="mb-7 inline-flex items-center gap-2 text-sm text-slate-500 transition hover:text-primary dark:text-slate-400"
                >
                    <span aria-hidden="true">←</span>
                    <!-- VIDEO_BACK_LABEL -->
                </a>

                <div
                    data-video-language-fallback
                    class="mb-7 hidden rounded-2xl border border-amber-200 bg-amber-50 px-5 py-4 text-sm leading-6 text-amber-900 dark:border-amber-900 dark:bg-amber-950/40 dark:text-amber-200"
                >
                    <!-- VIDEO_FALLBACK_NOTICE -->
                </div>

                <!-- 视频头部 -->
                <article
                    class="overflow-hidden rounded-3xl border border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900"
                >
                    <!-- 视频播放器或封面 -->
                    <!-- VIDEO_PLAYER -->

                    <div class="p-7 md:p-10">
                        <div class="mb-5 flex flex-wrap items-center gap-2">
                            <!-- VIDEO_PLATFORM_BADGE -->
                            <!-- VIDEO_CATEGORY_BADGE -->
                            <!-- VIDEO_FEATURED_BADGE -->
                        </div>

                        <h1
                            class="mb-5 text-4xl font-bold leading-tight tracking-tight text-slate-900 dark:text-white md:text-5xl"
                        >
                            <!-- VIDEO_TITLE -->
                        </h1>

                        <p
                            class="mb-8 max-w-4xl text-base leading-8 text-slate-500 dark:text-slate-400"
                        >
                            <!-- VIDEO_SUMMARY -->
                        </p>

                        <dl
                            class="grid gap-6 border-t border-slate-200 pt-7 text-sm dark:border-slate-800 sm:grid-cols-2 lg:grid-cols-4"
                        >
                            <div>
                                <dt class="mb-2 text-slate-400"><!-- VIDEO_PUBLISHED_LABEL --></dt>
                                <dd class="text-slate-700 dark:text-slate-300">
                                    <!-- VIDEO_DATE -->
                                </dd>
                            </div>

                            <div>
                                <dt class="mb-2 text-slate-400"><!-- VIDEO_DURATION_LABEL --></dt>
                                <dd class="text-slate-700 dark:text-slate-300">
                                    <!-- VIDEO_DURATION -->
                                </dd>
                            </div>

                            <div>
                                <dt class="mb-2 text-slate-400"><!-- VIDEO_CREATOR_LABEL --></dt>
                                <dd class="text-slate-700 dark:text-slate-300">
                                    <!-- VIDEO_CREATOR -->
                                </dd>
                            </div>

                            <div>
                                <dt class="mb-2 text-slate-400"><!-- VIDEO_UPDATED_LABEL --></dt>
                                <dd class="text-slate-700 dark:text-slate-300">
                                    <!-- VIDEO_UPDATED -->
                                </dd>
                            </div>
                        </dl>

                        <div class="mt-8">
                            <!-- VIDEO_SOURCE_LINK -->
                        </div>
                    </div>
                </article>

                <!-- 正文和目录 -->
                <div class="mt-10 grid gap-8 lg:grid-cols-[minmax(0,1fr)_240px]">

                    <article
                        class="video-detail-content min-w-0 rounded-3xl border border-slate-200 bg-white p-7 leading-8 dark:border-slate-800 dark:bg-slate-900 md:p-10"
                    >
                        <!-- VIDEO_CONTENT -->
                    </article>

                    <aside class="hidden lg:block">
                        <div
                            class="sticky top-[calc(var(--freecat-page-top-offset)+24px)] rounded-3xl border border-slate-200 bg-white p-6 dark:border-slate-800 dark:bg-slate-900"
                        >
                            <h2
                                class="mb-5 text-base font-semibold text-slate-900 dark:text-white"
                            >
                                <!-- VIDEO_TOC_LABEL -->
                            </h2>

                            <div
                                class="text-sm leading-7 text-slate-500 dark:text-slate-400"
                            >
                                <!-- VIDEO_TOC -->
                            </div>
                        </div>
                    </aside>
                </div>

                <!-- 关联内容 -->
                <section
                    class="mt-10 grid gap-6 md:grid-cols-2"
                >
                    <div
                        class="rounded-3xl border border-slate-200 bg-white p-7 dark:border-slate-800 dark:bg-slate-900"
                    >
                        <h2
                            class="mb-5 text-xl font-semibold text-slate-900 dark:text-white"
                        >
                            <!-- VIDEO_RELATED_PROJECTS_LABEL -->
                        </h2>

                        <div class="text-sm leading-7 text-slate-500 dark:text-slate-400">
                            <!-- VIDEO_RELATED_PROJECTS -->
                        </div>
                    </div>

                    <div
                        class="rounded-3xl border border-slate-200 bg-white p-7 dark:border-slate-800 dark:bg-slate-900"
                    >
                        <h2
                            class="mb-5 text-xl font-semibold text-slate-900 dark:text-white"
                        >
                            <!-- VIDEO_RELATED_ARTICLES_LABEL -->
                        </h2>

                        <div class="text-sm leading-7 text-slate-500 dark:text-slate-400">
                            <!-- VIDEO_RELATED_ARTICLES -->
                        </div>
                    </div>
                </section>

            </div>
        </main>

        <!-- INCLUDE:footer-no-social -->
    </div>

    <!-- INCLUDE:scripts-end -->
</body>

</html>
