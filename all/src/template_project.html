<!DOCTYPE html>
<html lang="<!-- SITE_LANGUAGE -->">

<head>
    <!-- INCLUDE:head-base -->

    <title><!-- PROJECT_TITLE --> - <!-- SITE_TITLE --></title>

    <!-- PROJECT_SEO_HEAD -->

    <style>
        html {
            scroll-behavior: smooth;
        }

        .project-content h1 {
            margin-top: 3.5rem;
            margin-bottom: 1.25rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid #e2e8f0;
            color: #0f172a;
            font-size: 1.8rem;
            font-weight: 700;
            line-height: 1.4;
            scroll-margin-top: 7rem;
        }

        .project-content h1:first-child {
            margin-top: 0;
        }

        .project-content h2 {
            margin-top: 2.75rem;
            margin-bottom: 1rem;
            color: #1e293b;
            font-size: 1.45rem;
            font-weight: 700;
            line-height: 1.45;
            scroll-margin-top: 7rem;
        }

        .project-content h3 {
            margin-top: 2rem;
            margin-bottom: 0.8rem;
            color: #334155;
            font-size: 1.15rem;
            font-weight: 650;
            line-height: 1.5;
            scroll-margin-top: 7rem;
        }

        .project-content p {
            margin: 0.9rem 0;
            line-height: 1.95;
        }

        .project-content ul,
        .project-content ol {
            margin: 1.1rem 0;
            padding-left: 1.6rem;
        }

        .project-content ul {
            list-style: disc;
        }

        .project-content ol {
            list-style: decimal;
        }

        .project-content li {
            margin: 0.5rem 0;
            line-height: 1.85;
        }

        .project-content blockquote {
            margin: 1.75rem 0;
            padding: 1.25rem 1.5rem;
            border-left: 4px solid #22c55e;
            border-radius: 0 1rem 1rem 0;
            background: #f8fafc;
            color: #475569;
            line-height: 1.9;
        }

        .project-content img {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 1.75rem auto;
            border-radius: 1rem;
            box-shadow: 0 16px 40px rgb(15 23 42 / 10%);
        }

        .project-content a {
            color: #16a34a;
            text-decoration: underline;
            text-underline-offset: 0.2em;
        }

        .project-content pre {
            overflow-x: auto;
            margin: 1.5rem 0;
            border-radius: 1rem;
        }

        .project-content table {
            width: 100%;
            margin: 1.5rem 0;
            border-collapse: collapse;
        }

        .project-content th,
        .project-content td {
            padding: 0.8rem 1rem;
            border: 1px solid #e2e8f0;
            text-align: left;
        }

        .project-content th {
            background: #f8fafc;
            color: #1e293b;
            font-weight: 650;
        }

        .dark .project-content h1 {
            border-color: #334155;
            color: #f8fafc;
        }

        .dark .project-content h2 {
            color: #e2e8f0;
        }

        .dark .project-content h3 {
            color: #cbd5e1;
        }

        .dark .project-content blockquote {
            background: #0f172a;
            color: #cbd5e1;
        }

        .dark .project-content th,
        .dark .project-content td {
            border-color: #334155;
        }

        .dark .project-content th {
            background: #0f172a;
            color: #e2e8f0;
        }
    </style>
</head>

<body
    class="bg-background-light font-display text-[#1e293b] transition-colors duration-200 dark:bg-background-dark dark:text-slate-200"
>
    <div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">

        <!-- INCLUDE:header -->

        <main
            class="page-blur-target mt-[var(--freecat-page-top-offset)] grow px-5 pb-20 pt-10 sm:px-8 md:px-16 lg:px-28"
        >
            <div class="mx-auto w-full max-w-[1100px]">

                <!-- 返回项目列表 -->
                <div class="mb-6">
                    <a
                        href="/projects"
                        class="inline-flex items-center gap-2 text-sm text-slate-500 transition hover:text-primary dark:text-slate-400"
                    >
                        <span aria-hidden="true">←</span>
                        返回项目列表
                    </a>
                </div>

                <!-- 项目头部 -->
                <header
                    class="mb-10 overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-sm dark:border-slate-800 dark:bg-slate-900"
                >
                    <!-- PROJECT_COVER -->

                    <div class="p-7 md:p-12">
                        <div class="mb-5 flex flex-wrap items-center gap-3">
                            <!-- PROJECT_CATEGORY -->

                            <!-- PROJECT_STATUS -->

                            <!-- PROJECT_FEATURED -->
                        </div>

                        <h1
                            class="mb-5 text-3xl font-bold leading-tight tracking-tight text-slate-900 dark:text-white md:text-5xl"
                        >
                            <!-- PROJECT_TITLE -->
                        </h1>

                        <p
                            class="max-w-3xl text-base leading-8 text-slate-500 dark:text-slate-400 md:text-lg"
                        >
                            <!-- PROJECT_SUMMARY -->
                        </p>

                        <dl
                            class="mt-8 grid grid-cols-1 gap-4 border-t border-slate-200 pt-7 dark:border-slate-700 sm:grid-cols-2 lg:grid-cols-4"
                        >
                            <div>
                                <dt
                                    class="mb-1 text-xs uppercase tracking-wider text-slate-400"
                                >
                                    项目时间
                                </dt>

                                <dd
                                    class="text-sm text-slate-700 dark:text-slate-300"
                                >
                                    <!-- PROJECT_DATE -->
                                </dd>
                            </div>

                            <div>
                                <dt
                                    class="mb-1 text-xs uppercase tracking-wider text-slate-400"
                                >
                                    项目地点
                                </dt>

                                <dd
                                    class="text-sm text-slate-700 dark:text-slate-300"
                                >
                                    <!-- PROJECT_LOCATION -->
                                </dd>
                            </div>

                            <div>
                                <dt
                                    class="mb-1 text-xs uppercase tracking-wider text-slate-400"
                                >
                                    承担角色
                                </dt>

                                <dd
                                    class="text-sm text-slate-700 dark:text-slate-300"
                                >
                                    <!-- PROJECT_ROLE -->
                                </dd>
                            </div>

                            <div>
                                <dt
                                    class="mb-1 text-xs uppercase tracking-wider text-slate-400"
                                >
                                    最后更新
                                </dt>

                                <dd
                                    class="text-sm text-slate-700 dark:text-slate-300"
                                >
                                    <!-- PROJECT_UPDATED -->
                                </dd>
                            </div>
                        </dl>
                    </div>
                </header>

                <div
                    class="grid grid-cols-1 items-start gap-8 lg:grid-cols-[minmax(0,1fr)_240px]"
                >
                    <!-- 项目正文 -->
                    <article
                        class="rounded-3xl border border-slate-200 bg-white px-6 py-8 shadow-sm dark:border-slate-800 dark:bg-slate-900 sm:px-9 md:px-12 md:py-12"
                    >
                        <div
                            class="project-content max-w-none text-base leading-8 text-slate-700 dark:text-slate-300"
                        >
                            <!-- PROJECT_CONTENT -->
                        </div>
                    </article>

                    <!-- 项目侧栏 -->
                    <aside class="hidden lg:block">
                        <div
                            class="sticky top-28 rounded-2xl border border-slate-200 bg-white p-5 dark:border-slate-800 dark:bg-slate-900"
                        >
                            <h2
                                class="mb-4 text-sm font-semibold text-slate-800 dark:text-white"
                            >
                                项目目录
                            </h2>

                            <nav
                                class="project-toc text-sm leading-7 text-slate-500 dark:text-slate-400"
                                aria-label="项目目录"
                            >
                                <!-- PROJECT_TOC -->
                            </nav>
                        </div>
                    </aside>
                </div>

                <!-- 相关内容 -->
                <section
                    class="mt-10 rounded-3xl border border-slate-200 bg-white p-7 dark:border-slate-800 dark:bg-slate-900 md:p-10"
                >
                    <h2
                        class="mb-6 text-2xl font-semibold text-slate-900 dark:text-white"
                    >
                        相关内容
                    </h2>

                    <div
                        class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-4"
                    >
                        <!-- 相关文章 -->
                        <div
                            class="rounded-2xl bg-slate-50 p-5 dark:bg-slate-800/60"
                        >
                            <h3
                                class="mb-3 text-sm font-semibold text-slate-800 dark:text-white"
                            >
                                相关文章
                            </h3>

                            <div
                                class="text-sm leading-7 text-slate-500 dark:text-slate-400"
                            >
                                <!-- PROJECT_RELATED_ARTICLES -->
                            </div>
                        </div>

                        <!-- 相关视频 -->
                        <div
                            class="rounded-2xl bg-slate-50 p-5 dark:bg-slate-800/60"
                        >
                            <h3
                                class="mb-3 text-sm font-semibold text-slate-800 dark:text-white"
                            >
                                相关视频
                            </h3>

                            <div
                                class="text-sm leading-7 text-slate-500 dark:text-slate-400"
                            >
                                <!-- PROJECT_RELATED_VIDEOS -->
                            </div>
                        </div>

                        <!-- 相关图片 -->
                        <div
                            class="rounded-2xl bg-slate-50 p-5 dark:bg-slate-800/60"
                        >
                            <h3
                                class="mb-3 text-sm font-semibold text-slate-800 dark:text-white"
                            >
                                相关图片
                            </h3>

                            <div
                                class="text-sm leading-7 text-slate-500 dark:text-slate-400"
                            >
                                <!-- PROJECT_RELATED_GALLERY -->
                            </div>
                        </div>

                        <!-- 相关项目 -->
                        <div
                            class="rounded-2xl bg-slate-50 p-5 dark:bg-slate-800/60"
                        >
                            <h3
                                class="mb-3 text-sm font-semibold text-slate-800 dark:text-white"
                            >
                                相关项目
                            </h3>

                            <div
                                class="text-sm leading-7 text-slate-500 dark:text-slate-400"
                            >
                                <!-- PROJECT_RELATED_PROJECTS -->
                            </div>
                        </div>
                    </div>
                </section>

            </div>
        </main>

        <!-- INCLUDE:footer-no-social -->
    </div>

    <!-- INCLUDE:scripts-end -->
</body>

</html>
