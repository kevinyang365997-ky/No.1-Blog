<!--
    partials/header.html
    顶栏：Logo、导航、语言菜单、搜索、标签、主题切换
-->

<header
    class="fixed left-0 top-0 z-50 flex w-full items-center justify-between whitespace-nowrap border-b border-solid border-[#f0f2f4] bg-white/[0.98] px-3 py-3 backdrop-blur-md dark:border-gray-800 dark:bg-background-dark/[0.98] md:px-8 md:py-4 xl:px-16 2xl:px-40"
>
    <div
        class="header-blur-target mx-auto flex w-full max-w-[1600px] min-w-0 items-center justify-between gap-3 whitespace-nowrap"
    >
        <!-- 网站 Logo -->
        <a
            href="/"
            class="inline-flex min-w-0 max-w-[48vw] shrink-0 items-center gap-3 text-[#1e293b] dark:text-slate-200 md:max-w-none md:gap-4"
        >
            <div
                class="size-6 shrink-0 text-gray-700 dark:text-gray-300"
            >
                <!-- SITE_LOGO_ICON -->
            </div>

            <h2
                class="freecat-brand-text min-w-0 truncate text-base leading-tight tracking-[-0.015em] md:text-lg"
            >
                <!-- SITE_NAME -->
            </h2>
        </a>

        <div
            class="flex shrink-0 items-center justify-end gap-2 md:flex-1 lg:gap-3"
        >
            <!-- 桌面端导航 -->
            <nav
                id="nav-links"
                class="hidden items-center gap-3 md:flex lg:gap-5"
                aria-label="主导航"
            >
                <a
                    class="freecat-nav-text text-sm leading-normal text-slate-500 transition-colors duration-150 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-300"
                    href="/"
                >
                    首页
                </a>

                <a
                    class="freecat-nav-text text-sm leading-normal text-slate-500 transition-colors duration-150 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-300"
                    href="/all"
                >
                    文章
                </a>

                <a
                    class="freecat-nav-text text-sm leading-normal text-slate-500 transition-colors duration-150 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-300"
                    href="/resume"
                >
                    个人履历
                </a>

                <a
                    class="freecat-nav-text text-sm leading-normal text-slate-500 transition-colors duration-150 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-300"
                    href="/projects"
                >
                    项目
                </a>

                <a
                    class="freecat-nav-text text-sm leading-normal text-slate-500 transition-colors duration-150 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-300"
                    href="/gallery"
                >
                    图库
                </a>

                <a
                    class="freecat-nav-text text-sm leading-normal text-slate-500 transition-colors duration-150 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-300"
                    href="/videos"
                >
                    视频
                </a>

                <a
                    class="freecat-nav-text text-sm leading-normal text-slate-500 transition-colors duration-150 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-300"
                    href="/about"
                >
                    关于
                </a>
            </nav>

            <!-- 移动端关于按钮 -->
            <a
                href="/about"
                aria-label="关于"
                class="t-btn-icon group relative flex size-9 items-center justify-center rounded-full border border-gray-200 bg-[#f0f2f4] text-[#1e293b] hover:text-primary dark:border-gray-700 dark:bg-gray-800 dark:text-slate-200 dark:hover:text-primary md:hidden"
            >
                <svg
                    class="icon-breathe text-lg text-gray-700 group-hover:rotate-6 dark:text-gray-400"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="currentColor"
                    width="1em"
                    height="1em"
                    aria-hidden="true"
                >
                    <path
                        d="M20 22H18V20C18 18.3431 16.6569 17 15 17H9C7.34315 17 6 18.3431 6 20V22H4V20C4 17.2386 6.23858 15 9 15H15C17.7614 15 20 17.2386 20 20V22ZM12 13C8.68629 13 6 10.3137 6 7C6 3.68629 8.68629 1 12 1C15.3137 1 18 3.68629 18 7C18 10.3137 15.3137 13 12 13ZM12 11C14.2091 11 16 9.20914 16 7C16 4.79086 14.2091 3 12 3C9.79086 3 8 4.79086 8 7C8 9.20914 9.79086 11 12 11Z"
                    ></path>
                </svg>
            </a>

            <!-- 移动端文章按钮 -->
            <a
                href="/all"
                aria-label="全部文章"
                class="t-btn-icon group relative flex size-9 items-center justify-center rounded-full border border-gray-200 bg-[#f0f2f4] text-[#1e293b] hover:text-primary dark:border-gray-700 dark:bg-gray-800 dark:text-slate-200 dark:hover:text-primary md:hidden"
            >
                <svg
                    class="icon-breathe text-lg text-gray-700 group-hover:rotate-6 dark:text-gray-400"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="currentColor"
                    width="1em"
                    height="1em"
                    aria-hidden="true"
                >
                    <path
                        d="M5 3H19C20.1046 3 21 3.89543 21 5V19C21 20.1046 20.1046 21 19 21H5C3.89543 21 3 20.1046 3 19V5C3 3.89543 3.89543 3 5 3ZM7 7V9H17V7H7ZM7 11V13H17V11H7ZM7 15V17H14V15H7Z"
                    ></path>
                </svg>
            </a>

            <!-- NAV_AUDIO_BUTTON -->

            <!-- 语言选择器 -->
            <details
                id="language-menu"
                class="group relative hidden xl:block"
            >
                <summary
                    aria-label="选择语言"
                    class="flex h-10 cursor-pointer list-none items-center justify-center gap-2 rounded-full border border-gray-200 bg-[#f0f2f4] px-4 text-sm font-medium text-slate-600 transition hover:text-primary dark:border-gray-700 dark:bg-gray-800 dark:text-slate-300 dark:hover:text-primary"
                    style="list-style: none;"
                >
                    <!-- 地球图标 -->
                    <svg
                        class="size-5"
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        fill="currentColor"
                        aria-hidden="true"
                    >
                        <path
                            d="M12 2C17.5228 2 22 6.47715 22 12C22 17.5228 17.5228 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2ZM19.9381 11C19.4924 7.94668 17.1192 5.52674 14.0823 5.01018C14.582 6.77238 14.8808 8.79984 14.9693 11H19.9381ZM9.03068 11C9.11921 8.79984 9.41803 6.77238 9.91772 5.01018C6.88078 5.52674 4.50761 7.94668 4.06189 11H9.03068ZM4.06189 13C4.50761 16.0533 6.88078 18.4733 9.91772 18.9898C9.41803 17.2276 9.11921 15.2002 9.03068 13H4.06189ZM14.9693 13C14.8808 15.2002 14.582 17.2276 14.0823 18.9898C17.1192 18.4733 19.4924 16.0533 19.9381 13H14.9693ZM11.0314 11H12.9686C12.867 8.66203 12.5 6.59627 12 5.0646C11.5 6.59627 11.133 8.66203 11.0314 11ZM11.0314 13C11.133 15.338 11.5 17.4037 12 18.9354C12.5 17.4037 12.867 15.338 12.9686 13H11.0314Z"
                        ></path>
                    </svg>

                    <span>Language</span>

                    <svg
                        class="size-4 transition-transform duration-200 group-open:rotate-180"
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        fill="currentColor"
                        aria-hidden="true"
                    >
                        <path
                            d="M12 15.5L5.5 9L6.91 7.59L12 12.67L17.09 7.59L18.5 9L12 15.5Z"
                        ></path>
                    </svg>
                </summary>

                <!-- 语言卡片面板 -->
                <div
                    class="absolute right-0 top-[calc(100%+0.75rem)] z-[70] w-[560px] max-w-[calc(100vw-2rem)] rounded-3xl border border-slate-200 bg-white p-5 shadow-2xl dark:border-slate-700 dark:bg-slate-900"
                >
                    <div class="mb-4">
                        <h2
                            class="text-base font-semibold text-slate-900 dark:text-white"
                        >
                            选择语言
                        </h2>

                        <p
                            class="mt-1 text-xs leading-6 text-slate-500 dark:text-slate-400"
                        >
                            当前阶段保存语言偏好，后续接入对应的多语言页面。
                        </p>
                    </div>

                    <div
                        class="columns-2 gap-3 sm:columns-3"
                        role="menu"
                        aria-label="网站语言"
                    >
                        <!-- 中文简体 -->
                        <button
                            type="button"
                            role="menuitem"
                            data-language="zh-CN"
                            data-language-name="中文（简体）"
                            class="language-card mb-3 flex w-full break-inside-avoid items-center gap-3 rounded-2xl border border-slate-200 bg-slate-50 p-4 text-left transition hover:-translate-y-0.5 hover:border-primary hover:bg-emerald-50 dark:border-slate-700 dark:bg-slate-800 dark:hover:border-primary dark:hover:bg-emerald-950/30"
                        >
                            <span
                                class="flex size-9 shrink-0 items-center justify-center rounded-full bg-white text-xs font-semibold text-slate-600 shadow-sm dark:bg-slate-700 dark:text-slate-200"
                                aria-hidden="true"
                            >
                                CN
                            </span>

                            <span>
                                <strong
                                    class="block text-sm text-slate-800 dark:text-white"
                                >
                                    中文（简体）
                                </strong>

                                <small class="text-xs text-slate-400">
                                    zh-CN
                                </small>
                            </span>
                        </button>

                        <!-- 中文繁体 -->
                        <button
                            type="button"
                            role="menuitem"
                            data-language="zh-TW"
                            data-language-name="中文（繁体）"
                            class="language-card mb-3 flex w-full break-inside-avoid items-center gap-3 rounded-2xl border border-slate-200 bg-slate-50 p-4 text-left transition hover:-translate-y-0.5 hover:border-primary hover:bg-emerald-50 dark:border-slate-700 dark:bg-slate-800 dark:hover:border-primary dark:hover:bg-emerald-950/30"
                        >
                            <span
                                class="flex size-9 shrink-0 items-center justify-center rounded-full bg-white text-xs font-semibold text-slate-600 shadow-sm dark:bg-slate-700 dark:text-slate-200"
                                aria-hidden="true"
                            >
                                TW
                            </span>

                            <span>
                                <strong
                                    class="block text-sm text-slate-800 dark:text-white"
                                >
                                    中文（繁体）
                                </strong>

                                <small class="text-xs text-slate-400">
                                    zh-TW
                                </small>
                            </span>
                        </button>

                        <!-- 英语美国 -->
                        <button
                            type="button"
                            role="menuitem"
                            data-language="en-US"
                            data-language-name="English (US)"
                            class="language-card mb-3 flex w-full break-inside-avoid items-center gap-3 rounded-2xl border border-slate-200 bg-slate-50 p-4 text-left transition hover:-translate-y-0.5 hover:border-primary hover:bg-emerald-50 dark:border-slate-700 dark:bg-slate-800 dark:hover:border-primary dark:hover:bg-emerald-950/30"
                        >
                            <span
                                class="flex size-9 shrink-0 items-center justify-center rounded-full bg-white text-xs font-semibold text-slate-600 shadow-sm dark:bg-slate-700 dark:text-slate-200"
                                aria-hidden="true"
                            >
                                US
                            </span>

                            <span>
                                <strong
                                    class="block text-sm text-slate-800 dark:text-white"
                                >
                                    English (US)
                                </strong>

                                <small class="text-xs text-slate-400">
                                    en-US
                                </small>
                            </span>
                        </button>

                        <!-- 英语英国 -->
                        <button
                            type="button"
                            role="menuitem"
                            data-language="en-GB"
                            data-language-name="English (UK)"
                            class="language-card mb-3 flex w-full break-inside-avoid items-center gap-3 rounded-2xl border border-slate-200 bg-slate-50 p-4 text-left transition hover:-translate-y-0.5 hover:border-primary hover:bg-emerald-50 dark:border-slate-700 dark:bg-slate-800 dark:hover:border-primary dark:hover:bg-emerald-950/30"
                        >
                            <span
                                class="flex size-9 shrink-0 items-center justify-center rounded-full bg-white text-xs font-semibold text-slate-600 shadow-sm dark:bg-slate-700 dark:text-slate-200"
                                aria-hidden="true"
                            >
                                UK
                            </span>

                            <span>
                                <strong
                                    class="block text-sm text-slate-800 dark:text-white"
                                >
                                    English (UK)
                                </strong>

                                <small class="text-xs text-slate-400">
                                    en-GB
                                </small>
                            </span>
                        </button>

                        <!-- 西班牙语 -->
                        <button
                            type="button"
                            role="menuitem"
                            data-language="es"
                            data-language-name="Español"
                            class="language-card mb-3 flex w-full break-inside-avoid items-center gap-3 rounded-2xl border border-slate-200 bg-slate-50 p-4 text-left transition hover:-translate-y-0.5 hover:border-primary hover:bg-emerald-50 dark:border-slate-700 dark:bg-slate-800 dark:hover:border-primary dark:hover:bg-emerald-950/30"
                        >
                            <span
                                class="flex size-9 shrink-0 items-center justify-center rounded-full bg-white text-xs font-semibold text-slate-600 shadow-sm dark:bg-slate-700 dark:text-slate-200"
                                aria-hidden="true"
                            >
                                ES
                            </span>

                            <span>
                                <strong
                                    class="block text-sm text-slate-800 dark:text-white"
                                >
                                    Español
                                </strong>

                                <small class="text-xs text-slate-400">
                                    es
                                </small>
                            </span>
                        </button>

                        <!-- 葡萄牙语 -->
                        <button
                            type="button"
                            role="menuitem"
                            data-language="pt"
                            data-language-name="Português"
                            class="language-card mb-3 flex w-full break-inside-avoid items-center gap-3 rounded-2xl border border-slate-200 bg-slate-50 p-4 text-left transition hover:-translate-y-0.5 hover:border-primary hover:bg-emerald-50 dark:border-slate-700 dark:bg-slate-800 dark:hover:border-primary dark:hover:bg-emerald-950/30"
                        >
                            <span
                                class="flex size-9 shrink-0 items-center justify-center rounded-full bg-white text-xs font-semibold text-slate-600 shadow-sm dark:bg-slate-700 dark:text-slate-200"
                                aria-hidden="true"
                            >
                                PT
                            </span>

                            <span>
                                <strong
                                    class="block text-sm text-slate-800 dark:text-white"
                                >
                                    Português
                                </strong>

                                <small class="text-xs text-slate-400">
                                    pt
                                </small>
                            </span>
                        </button>

                        <!-- 德语 -->
                        <button
                            type="button"
                            role="menuitem"
                            data-language="de"
                            data-language-name="Deutsch"
                            class="language-card mb-3 flex w-full break-inside-avoid items-center gap-3 rounded-2xl border border-slate-200 bg-slate-50 p-4 text-left transition hover:-translate-y-0.5 hover:border-primary hover:bg-emerald-50 dark:border-slate-700 dark:bg-slate-800 dark:hover:border-primary dark:hover:bg-emerald-950/30"
                        >
                            <span
                                class="flex size-9 shrink-0 items-center justify-center rounded-full bg-white text-xs font-semibold text-slate-600 shadow-sm dark:bg-slate-700 dark:text-slate-200"
                                aria-hidden="true"
                            >
                                DE
                            </span>

                            <span>
                                <strong
                                    class="block text-sm text-slate-800 dark:text-white"
                                >
                                    Deutsch
                                </strong>

                                <small class="text-xs text-slate-400">
                                    de
                                </small>
                            </span>
                        </button>

                        <!-- 法语 -->
                        <button
                            type="button"
                            role="menuitem"
                            data-language="fr"
                            data-language-name="Français"
                            class="language-card mb-3 flex w-full break-inside-avoid items-center gap-3 rounded-2xl border border-slate-200 bg-slate-50 p-4 text-left transition hover:-translate-y-0.5 hover:border-primary hover:bg-emerald-50 dark:border-slate-700 dark:bg-slate-800 dark:hover:border-primary dark:hover:bg-emerald-950/30"
                        >
                            <span
                                class="flex size-9 shrink-0 items-center justify-center rounded-full bg-white text-xs font-semibold text-slate-600 shadow-sm dark:bg-slate-700 dark:text-slate-200"
                                aria-hidden="true"
                            >
                                FR
                            </span>

                            <span>
                                <strong
                                    class="block text-sm text-slate-800 dark:text-white"
                                >
                                    Français
                                </strong>

                                <small class="text-xs text-slate-400">
                                    fr
                                </small>
                            </span>
                        </button>

                        <!-- 俄语 -->
                        <button
                            type="button"
                            role="menuitem"
                            data-language="ru"
                            data-language-name="Русский"
                            class="language-card mb-3 flex w-full break-inside-avoid items-center gap-3 rounded-2xl border border-slate-200 bg-slate-50 p-4 text-left transition hover:-translate-y-0.5 hover:border-primary hover:bg-emerald-50 dark:border-slate-700 dark:bg-slate-800 dark:hover:border-primary dark:hover:bg-emerald-950/30"
                        >
                            <span
                                class="flex size-9 shrink-0 items-center justify-center rounded-full bg-white text-xs font-semibold text-slate-600 shadow-sm dark:bg-slate-700 dark:text-slate-200"
                                aria-hidden="true"
                            >
                                RU
                            </span>

                            <span>
                                <strong
                                    class="block text-sm text-slate-800 dark:text-white"
                                >
                                    Русский
                                </strong>

                                <small class="text-xs text-slate-400">
                                    ru
                                </small>
                            </span>
                        </button>
                    </div>

                    <p
                        id="language-selection-status"
                        class="mt-2 text-xs text-slate-400"
                        aria-live="polite"
                    ></p>
                </div>
            </details>

            <!-- 搜索按钮 -->
            <button
                id="search-toggle"
                aria-label="搜索"
                class="t-btn-icon group relative flex size-9 items-center justify-center rounded-full bg-[#f0f2f4] text-[#1e293b] hover:text-primary dark:bg-gray-800 dark:text-slate-200 dark:hover:text-primary md:size-10"
            >
                <svg
                    class="icon-breathe text-lg text-gray-700 group-hover:rotate-12 dark:text-gray-400 md:text-xl"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="currentColor"
                    width="1em"
                    height="1em"
                    aria-hidden="true"
                >
                    <path
                        d="M18.031 16.6168L22.3137 20.8995L20.8995 22.3137L16.6168 18.031C15.0769 19.263 13.124 20 11 20C6.032 20 2 15.968 2 11C2 6.032 6.032 2 11 2C15.968 2 20 6.032 20 11C20 13.124 19.263 15.0769 18.031 16.6168ZM16.0247 15.8748C17.2475 14.6146 18 12.8956 18 11C18 7.1325 14.8675 4 11 4C7.1325 4 4 7.1325 4 11C4 14.8675 7.1325 18 11 18C12.8956 18 14.6146 17.2475 15.8748 16.0247L16.0247 15.8748Z"
                    ></path>
                </svg>
            </button>

            <!-- 标签菜单 -->
            <div class="relative">
                <button
                    id="tag-menu-toggle"
                    aria-label="查看标签"
                    aria-expanded="false"
                    aria-controls="tag-menu"
                    class="t-btn-icon group relative flex size-9 items-center justify-center rounded-full border border-gray-200 bg-[#f0f2f4] text-[#1e293b] hover:text-primary dark:border-gray-700 dark:bg-gray-800 dark:text-slate-200 dark:hover:text-primary md:size-10"
                >
                    <svg
                        class="icon-breathe text-lg text-gray-700 group-hover:rotate-6 dark:text-gray-400 md:text-xl"
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        fill="currentColor"
                        width="1em"
                        height="1em"
                        aria-hidden="true"
                    >
                        <path
                            d="M14.8287 7.75737L9.1718 13.4142C8.78127 13.8047 8.78127 14.4379 9.1718 14.8284C9.56232 15.219 10.1955 15.219 10.586 14.8284L16.2429 9.17158C17.4144 8.00001 17.4144 6.10052 16.2429 4.92894C15.0713 3.75737 13.1718 3.75737 12.0002 4.92894L6.34337 10.5858C4.39075 12.5384 4.39075 15.7042 6.34337 17.6569C8.29599 19.6095 11.4618 19.6095 13.4144 17.6569L19.0713 12L20.4855 13.4142L14.8287 19.0711C12.095 21.8047 7.66283 21.8047 4.92916 19.0711C2.19549 16.3374 2.19549 11.9053 4.92916 9.17158L10.586 3.51473C12.5386 1.56211 15.7045 1.56211 17.6571 3.51473C19.6097 5.46735 19.6097 8.63317 17.6571 10.5858L12.0002 16.2427C10.8287 17.4142 8.92916 17.4142 7.75759 16.2427C6.58601 15.0711 6.58601 13.1716 7.75759 12L13.4144 6.34316L14.8287 7.75737Z"
                        ></path>
                    </svg>
                </button>

                <div
                    id="tag-menu"
                    role="menu"
                    aria-label="标签"
                    data-origin="top-right"
                    class="t-dropdown tag-menu-panel absolute left-1/2 top-[calc(100%+0.75rem)] z-50 rounded-xl border border-slate-200 bg-white p-2 dark:border-slate-700 dark:bg-slate-900"
                >
                    <div
                        class="tag-menu-items max-h-[calc(100vh-7rem)] overflow-y-auto overscroll-contain pr-1"
                        data-tag-menu-items
                    >
                        <!-- TAG_MENU_ITEMS -->
                    </div>
                </div>
            </div>

            <!-- 主题切换 -->
            <button
                id="theme-toggle"
                aria-label="切换主题"
                class="t-btn-icon group relative flex size-9 items-center justify-center rounded-full border border-gray-200 bg-[#f0f2f4] text-[#1e293b] hover:text-primary dark:border-gray-700 dark:bg-gray-800 dark:text-slate-200 dark:hover:text-primary md:size-10"
            >
                <svg
                    class="icon-breathe text-lg text-gray-700 group-hover:rotate-12 dark:text-gray-400 md:text-xl"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="currentColor"
                    width="1em"
                    height="1em"
                    aria-hidden="true"

<!-- 语言菜单交互 -->
<script>
    (() => {
        const languageMenu =
            document.getElementById('language-menu');

        if (
            !languageMenu ||
            languageMenu.dataset.initialized === 'true'
        ) {
            return;
        }

        languageMenu.dataset.initialized = 'true';

        const languageCards =
            languageMenu.querySelectorAll('[data-language]');

        const status =
            document.getElementById('language-selection-status');

        const selectedClassNames = [
            'border-primary',
            'bg-emerald-50',
            'dark:bg-emerald-950/30'
        ];

        function updateSelectedLanguage(languageCode) {
            languageCards.forEach((card) => {
                const selected =
                    card.dataset.language === languageCode;

                card.setAttribute(
                    'aria-current',
                    selected ? 'true' : 'false'
                );

                selectedClassNames.forEach((className) => {
                    card.classList.toggle(className, selected);
                });
            });

            const selectedCard =
                languageMenu.querySelector(
                    `[data-language="${languageCode}"]`
                );

            if (selectedCard && status) {
                status.textContent =
                    `当前选择：${selectedCard.dataset.languageName}`;
            }
        }

        let savedLanguage = 'zh-CN';

        try {
            savedLanguage =
                localStorage.getItem('freecat-language') ||
                'zh-CN';
        } catch (error) {
            savedLanguage = 'zh-CN';
        }

        updateSelectedLanguage(savedLanguage);

        languageCards.forEach((card) => {
            card.addEventListener('click', () => {
                const languageCode =
                    card.dataset.language;

                try {
                    localStorage.setItem(
                        'freecat-language',
                        languageCode
                    );
                } catch (error) {
                    // 浏览器禁止本地存储时仍允许选择。
                }

                updateSelectedLanguage(languageCode);
                languageMenu.removeAttribute('open');
            });
        });

        document.addEventListener('click', (event) => {
            if (!languageMenu.contains(event.target)) {
                languageMenu.removeAttribute('open');
            }
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                languageMenu.removeAttribute('open');
            }
        });
    })();
</script>
