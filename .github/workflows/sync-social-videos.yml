name: Sync TikTok videos

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-tiktok-videos
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ vars.SOCIAL_VIDEO_SYNC_ENABLED == 'true' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test TikTok sync logic
        run: node --test automation/social-video-sync.test.mjs

      - name: Synchronize new TikTok videos
        env:
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
        run: node automation/social-video-sync.mjs

      - name: Commit synchronized videos
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No new TikTok videos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos all/image/videos/tiktok
          git commit -m "chore: sync new TikTok videos"
          git pull --rebase origin main
          git push origin main
